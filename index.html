<!doctype html>
<html lang="pt-BR" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <title>Leandro TV+ | Revendedor Oficial UniTV - Canais 4K, Filmes e Séries</title>
    <meta name="description" content="Plataforma premium de TV online com mais de 100.000 conteúdos, canais ao vivo em 4K e Full HD, filmes e séries sem travamentos. Solicite seu teste grátis!" />
    <meta name="robots" content="index, follow" />
    <meta property="og:title" content="Leandro TV+ | Revendedor Oficial UniTV" />
    <meta property="og:description" content="A melhor experiência em streaming e canais ao vivo em 4K com mais de 100.000 conteúdos. Solicite seu teste grátis!" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/favicon-192x192.png?v=4" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Official Leandro TV+ Circular Favicon & Mobile Touch Icons -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico?v=4" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=4" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png?v=4" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon-64x64.png?v=4" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192x192.png?v=4" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=4" />

    <!-- Preload ONLY the responsive LCP image (AVIF/WebP priority) -->
    <link
      rel="preload"
      as="image"
      href="/assets/aistudio/hero-tv-640.webp"
      imagesrcset="/assets/aistudio/hero-tv-640.webp 640w, /assets/aistudio/hero-tv-1024.webp 1024w"
      imagesizes="(max-width: 672px) 92vw, 672px"
      type="image/webp"
      fetchpriority="high"
    />

    <!-- Preconnect only to actually used font origins -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Non-render-blocking Google Fonts with reduced weight subset & font-display: swap -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@700;800;900&family=Plus+Jakarta+Sans:wght@500;700;800&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@700;800;900&family=Plus+Jakarta+Sans:wght@500;700;800&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@700;800;900&family=Plus+Jakarta+Sans:wght@500;700;800&display=swap"
      />
    </noscript>

    <!-- Inline Critical Above-The-Fold CSS for Instant First Paint on Slow 4G -->
    <style>
      *,::before,::after{box-sizing:border-box}
      html{-webkit-text-size-adjust:100%;text-size-adjust:100%;scroll-behavior:smooth}
      body{margin:0;background-color:#ffffff;color:#0f172a;font-family:'Plus Jakarta Sans',system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
      h1,h2,h3,h4{font-family:'Outfit','Plus Jakarta Sans',system-ui,-apple-system,sans-serif;letter-spacing:-0.02em}
      img,svg{display:block;max-width:100%;height:auto}
    </style>
  </head>
  <body class="bg-white text-slate-900 font-sans antialiased selection:bg-pink-600 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
